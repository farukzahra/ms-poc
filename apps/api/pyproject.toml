[project]
name = "enterprise-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "demo-data",
  "httpx>=0.28.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.18",
  "mcp>=1.6.0",
  "azure-search-documents>=11.6.0",
  "azure-storage-blob>=12.24.0",
  "openai>=1.58.0",
  "semantic-kernel>=1.21.0",
  "opentelemetry-api>=1.29.0",
  "azure-monitor-opentelemetry>=1.6.0",
  "PyJWT>=2.10.0",
]

[tool.uv.sources]
demo-data = { workspace = true }

[project.scripts]
enterprise-api = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "httpx>=0.28.0",
]
