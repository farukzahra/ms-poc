[project]
name = "enterprise-mocks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "demo-data",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[tool.uv.sources]
demo-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[project.scripts]
mock-service = "runner:main"
